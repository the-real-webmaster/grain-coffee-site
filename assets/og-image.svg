<?xml version="1.0" encoding="UTF-8"?>
<!-- Брендовая карточка для превью в соцсетях (Open Graph / Twitter Card).
     Заменяет внешние фото-плейсхолдеры: полностью самодостаточный SVG,
     без запросов к сторонним сервисам. Часть площадок (в т.ч. Twitter/X)
     не рендерит SVG в превью ссылок — перед публикацией в проде замените
     на растровый PNG/JPG 1200×630 с тем же макетом (например, экспортировав
     этот файл через любой SVG-редактор или headless-браузер). -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1712"/>
      <stop offset="100%" stop-color="#15110d"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#dd9c4f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dd9c4f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- логотип-монограмма -->
  <g transform="translate(120,120) scale(3.4)" fill="none" stroke="#dd9c4f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30.5 12.5C28 9.6 24.3 8 20.5 8C12.5 8 6 14.5 6 22.5C6 30.5 12.5 37 20.5 37C28 37 34.2 31.4 34.9 24.2C35 23.1 34.9 22.5 34.9 22.5H23" stroke-width="2.4"/>
    <path d="M20.5 8C16 13 16 32 20.5 37" stroke-width="1.6" opacity="0.6"/>
    <path d="M31 4C31 6 33 6 33 8C33 10 31 10 31 12" stroke-width="1.6" opacity="0.85"/>
  </g>
  <text x="118" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="86" fill="#f2e9db">GRA<tspan fill="#dd9c4f" font-style="italic">IN</tspan></text>
  <text x="120" y="390" font-family="Arial, sans-serif" font-size="30" letter-spacing="1" fill="#b7a892">Спешелти-кофейня в центре города</text>
  <!-- декоративная чашка с дымком -->
  <g transform="translate(880,340)" fill="none" stroke="#dd9c4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <ellipse cx="90" cy="150" rx="95" ry="16" stroke-width="5"/>
    <path d="M20 60h140l-16 92a16 16 0 0 1-16 14H52a16 16 0 0 1-16-14L20 60Z"/>
    <path d="M160 72h18a26 26 0 0 1 0 52h-14"/>
    <path d="M55 20c-10 10-10 24 0 34M90 8c-10 10-10 28 0 38M125 20c-10 10-10 24 0 34" opacity="0.55" stroke-width="5"/>
  </g>
</svg>
